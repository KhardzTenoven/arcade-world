<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍓 Fruit Match — Bright Arcade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: 
        radial-gradient(circle at 15% 10%, #5434b9 0, transparent 30%),
        radial-gradient(circle at 85% 15%, #008eb4 0, transparent 28%),
        linear-gradient(135deg, #090d24, #11183a 60%, #080b20);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .gamepage {
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gamebar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(18px, 4vw);
      border-bottom: 1px solid #ffffff14;
      background: #080c20dd;
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .gamebar h1 {
      font-size: 22px;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      background: #ffffff0d;
      padding: 11px 16px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff18;
    }

    .gamearea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .gamebox {
      width: min(900px, 100%);
      height: min(100%, 820px);
      min-height: 0;
      border: 1px solid #ffffff18;
      border-radius: 26px;
      background: #ffffff09;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px #0005;
      padding: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .gamebox h2 {
      text-align: center;
      margin: 2px 0 10px;
    }

    .stats {
      text-align: center;
      color: #bfc9e7;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .multiplier-badge {
      color: #ffea00;
      font-weight: 900;
      transition: transform 0.2s;
      display: inline-block;
    }

    .multiplier-active {
      transform: scale(1.3);
      color: #ff4fa3;
    }

    .board {
      margin: auto;
      max-width: 100%;
      max-height: calc(100% - 110px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .fruitgrid {
      display: grid;
      gap: 6px;
      width: min(520px, 100%);
      margin: auto;
      touch-action: none;
    }

    .fruitgrid button {
      aspect-ratio: 1;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      font-size: clamp(20px, 4.5vw, 32px);
      cursor: grab;
      transition: transform 0.15s, background 0.15s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .fruitgrid button:active {
      cursor: grabbing;
    }

    .fruitgrid button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .touch {
      color: #8f9bc0;
      text-align: center;
      font-size: 13px;
      margin: 12px 0 0;
    }

    .center {
      text-align: center;
    }

    .restart {
      margin-top: 12px;
    }

    .complement-popup {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #ff007f, 0 0 40px #ffea00, 0 4px 10px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      white-space: nowrap;
    }

    .complement-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    @media (max-width: 760px) {
      .gamebox {
        padding: 12px;
        border-radius: 20px;
      }
      .gamebar {
        height: 62px;
        flex-basis: 62px;
      }
      .gamebar h1 {
        font-size: 18px;
      }
      .gamearea {
        padding: 8px;
      }
      .fruitgrid {
        gap: 4px;
      }
      .fruitgrid button {
        border-radius: 8px;
      }
    }

    @media (max-width: 480px) {
      .gamebox h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="gamepage">

  <header class="gamebar">
    <a class="btn" href="index.html">← Home</a>
    <h1>🍓 Fruit Match</h1>
    <div class="controls">
      <button class="btn" id="audioBtn" onclick="toggleAudio()">🎵 Sound: OFF</button>
    </div>
  </header>

  <main class="gamearea">
    <section class="gamebox">
      <div id="complement" class="complement-popup">GREAT MATCH!</div>
      <h2>🍓 Fruit Match</h2>
      <div class="stats">
        Level <b id="lvl">1</b> • Score: <b id="score">0</b>/<span id="target">200</span> • Moves: <b id="moves">15</b> • Multiplier: <span id="mult" class="multiplier-badge">1x</span>
      </div>
      <div class="board">
        <div id="grid" class="fruitgrid"></div>
        <div class="touch">Swipe any fruit up, down, left, or right to swap and match!</div>
      </div>
      <div class="center">
        <button class="btn restart" onclick="restartGame()">↻ Reset Game</button>
      </div>
    </section>
  </main>

  <script>
    const allFruits = ['🍓', '🍋', '🍇', '🍉', '🍊', '🍏', '🍍', '🍒', '🍌', '🫐', '🥝', '🍑', '🥑', '🍐', '🥭'];
    
    const levelConfigs = [
      { size: 6, fruitTypes: 5, target: 200, moves: 15 },
      { size: 6, fruitTypes: 6, target: 350, moves: 15 },
      { size: 7, fruitTypes: 8, target: 500, moves: 18 },
      { size: 7, fruitTypes: 10, target: 750, moves: 20 },
      { size: 8, fruitTypes: 12, target: 1000, moves: 22 },
      { size: 8, fruitTypes: 15, target: 1500, moves: 25 }
    ];

    let currentLevel = 0;
    let grid = [];
    let score = 0;
    let moves = 0;
    let targetScore = 0;
    let multiplier = 1;
    let isProcessing = false;

    let startX = 0;
    let startY = 0;
    let dragIndex = null;

    // Audio Engine Variables
    let audioCtx = null;
    let audioEnabled = false;
    let bgMusicTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      initAudio();
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').textContent = audioEnabled ? '🎵 Sound: ON' : '🎵 Sound: OFF';
      
      if (audioEnabled) {
        startBgMusic();
      } else {
        stopBgMusic();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Dynamic Pitch-Sweep Match Sound
    function playMatchSound(chain = 1) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const baseFreq = 240 + (chain * 90);
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, audioCtx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch (e) {}
    }

    // Procedural Percussion (Hi-Hat Ticks)
    function playNoisePercussion(duration = 0.04) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 6000;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {}
    }

    // Victory Flourish Jingle
    function playVictoryJingle() {
      if (!audioEnabled || !audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 'triangle', 0.3, 0.15);
        }, i * 90);
      });
    }

    // Dynamic Synthwave Arcade Background Music
    const chordProgression = [
      [261.63, 329.63, 392.00], // C Major
      [220.00, 261.63, 329.63], // A Minor
      [174.61, 220.00, 261.63], // F Major
      [196.00, 246.94, 293.66]  // G Major
    ];

    function startBgMusic() {
      if (bgMusicTimer) clearInterval(bgMusicTimer);
      
      let beat = 0;

      bgMusicTimer = setInterval(() => {
        if (!audioEnabled) return;

        const currentChord = chordProgression[Math.floor(beat / 8) % chordProgression.length];
        const arpeggioNote = currentChord[beat % currentChord.length];

        // High energetic lead synth
        playTone(arpeggioNote * 2, 'square', 0.1, 0.025);

        // Warm supporting bass pulse
        if (beat % 4 === 0) {
          playTone(currentChord[0] / 2, 'sawtooth', 0.25, 0.05);
        }

        // Rhythmic percussive tick
        if (beat % 2 === 1) {
          playNoisePercussion(0.04);
        }

        beat++;
      }, 130);
    }

    function stopBgMusic() {
      if (bgMusicTimer) {
        clearInterval(bgMusicTimer);
        bgMusicTimer = null;
      }
    }

    function speakComplement(text) {
      const banner = document.getElementById('complement');
      banner.textContent = text;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 900);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.1;
        utterance.pitch = 1.3;
        window.speechSynthesis.speak(utterance);
      }
    }

    function initLevel() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      score = 0;
      moves = config.moves;
      targetScore = config.target;
      multiplier = 1;
      isProcessing = false;

      document.getElementById('lvl').textContent = currentLevel + 1;
      document.getElementById('score').textContent = score;
      document.getElementById('target').textContent = targetScore;
      document.getElementById('moves').textContent = moves;
      updateMultiplierUI(1);

      const activePool = allFruits.slice(0, config.fruitTypes);

      do {
        grid = [];
        for (let i = 0; i < config.size * config.size; i++) {
          grid.push(activePool[Math.floor(Math.random() * activePool.length)]);
        }
      } while (checkMatches().length > 0);

      render();
    }

    function updateMultiplierUI(mult) {
      const multElem = document.getElementById('mult');
      multElem.textContent = `${mult}x`;
      if (mult > 1) {
        multElem.classList.add('multiplier-active');
      } else {
        multElem.classList.remove('multiplier-active');
      }
    }

    function render() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const gridElement = document.getElementById('grid');
      
      gridElement.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
      gridElement.innerHTML = '';

      grid.forEach((fruit, index) => {
        const button = document.createElement('button');
        button.textContent = fruit;

        button.onpointerdown = (e) => handlePointerDown(e, index);
        button.onpointermove = (e) => handlePointerMove(e);
        button.onpointerup = () => handlePointerEnd();
        button.onpointercancel = () => handlePointerEnd();

        gridElement.appendChild(button);
      });
    }

    function handlePointerDown(e, index) {
      if (isProcessing || moves <= 0) return;
      initAudio();
      dragIndex = index;
      startX = e.clientX;
      startY = e.clientY;
      e.target.setPointerCapture(e.pointerId);
    }

    function handlePointerMove(e) {
      if (dragIndex === null || isProcessing) return;

      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      const threshold = 25;

      if (Math.abs(deltaX) > threshold || Math.abs(deltaY) > threshold) {
        const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
        const SIZE = config.size;
        const row = Math.floor(dragIndex / SIZE);
        const col = dragIndex % SIZE;
        let targetIndex = null;

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX > 0 && col < SIZE - 1) targetIndex = dragIndex + 1;
          else if (deltaX < 0 && col > 0) targetIndex = dragIndex - 1;
        } else {
          if (deltaY > 0 && row < SIZE - 1) targetIndex = dragIndex + SIZE;
          else if (deltaY < 0 && row > 0) targetIndex = dragIndex - SIZE;
        }

        if (targetIndex !== null) {
          const idx1 = dragIndex;
          dragIndex = null;
          swapAndProcess(idx1, targetIndex);
        }
      }
    }

    function handlePointerEnd() {
      dragIndex = null;
    }

    async function swapAndProcess(idx1, idx2) {
      isProcessing = true;
      
      [grid[idx1], grid[idx2]] = [grid[idx2], grid[idx1]];
      render();

      const matches = checkMatches();

      if (matches.length > 0) {
        moves--;
        document.getElementById('moves').textContent = moves;
        await resolveMatches();

        if (score >= targetScore) {
          playVictoryJingle();
          speakComplement('LEVEL COMPLETED!');
          setTimeout(() => {
            if (currentLevel < levelConfigs.length - 1) {
              alert(`🎉 Level ${currentLevel + 1} Cleared! Moving to Level ${currentLevel + 2}!`);
              currentLevel++;
              initLevel();
            } else {
              speakComplement('UNSTOPPABLE!');
              alert('🏆 CONGRATULATIONS! You completed all Fruit Match levels!');
              restartGame();
            }
          }, 400);
        } else if (moves <= 0) {
          speakComplement('OUT OF MOVES!');
          setTimeout(() => {
            alert(`🎮 Out of moves! Target score not met. Try Level ${currentLevel + 1} again!`);
            initLevel();
          }, 400);
        }
      } else {
        playTone(150, 'sawtooth', 0.15, 0.1);
        await new Promise(r => setTimeout(r, 250));
        [grid[idx1], grid[idx2]] = [grid[idx2], grid[idx1]];
        render();
      }

      isProcessing = false;
    }

    function checkMatches() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const SIZE = config.size;
      const matchedIndices = new Set();

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE - 2; c++) {
          const idx = r * SIZE + c;
          const val = grid[idx];
          if (val && val === grid[idx + 1] && val === grid[idx + 2]) {
            matchedIndices.add(idx);
            matchedIndices.add(idx + 1);
            matchedIndices.add(idx + 2);
          }
        }
      }

      for (let r = 0; r < SIZE - 2; r++) {
        for (let c = 0; c < SIZE; c++) {
          const idx = r * SIZE + c;
          const val = grid[idx];
          if (val && val === grid[(r + 1) * SIZE + c] && val === grid[(r + 2) * SIZE + c]) {
            matchedIndices.add(idx);
            matchedIndices.add((r + 1) * SIZE + c);
            matchedIndices.add((r + 2) * SIZE + c);
          }
        }
      }

      return Array.from(matchedIndices);
    }

    async function resolveMatches() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const SIZE = config.size;
      const activePool = allFruits.slice(0, config.fruitTypes);
      
      let matches = checkMatches();
      let cascadeLevel = 0;

      while (matches.length > 0) {
        cascadeLevel++;
        playMatchSound(cascadeLevel);

        if (matches.length >= 5) {
          multiplier = Math.max(multiplier, matches.length - 2);
          speakComplement('SWEET COMPLEMENT!');
        } else if (matches.length === 4) {
          multiplier = Math.max(multiplier, 2);
          speakComplement('GREAT!');
        } else if (cascadeLevel >= 3) {
          speakComplement('UNSTOPPABLE!!!');
        } else if (cascadeLevel === 2) {
          speakComplement('SUPER COMBO!');
        } else if (matches.length === 3) {
          speakComplement('GOOD!');
        }

        updateMultiplierUI(multiplier);

        score += matches.length * 10 * multiplier;
        document.getElementById('score').textContent = score;

        matches.forEach(i => grid[i] = null);
        render();
        await new Promise(r => setTimeout(r, 200));

        for (let c = 0; c < SIZE; c++) {
          for (let r = SIZE - 1; r >= 0; r--) {
            const idx = r * SIZE + c;
            if (grid[idx] === null) {
              for (let lookup = r - 1; lookup >= 0; lookup--) {
                const lookupIdx = lookup * SIZE + c;
                if (grid[lookupIdx] !== null) {
                  grid[idx] = grid[lookupIdx];
                  grid[lookupIdx] = null;
                  break;
                }
              }
            }
          }
        }

        for (let i = 0; i < SIZE * SIZE; i++) {
          if (grid[i] === null) {
            grid[i] = activePool[Math.floor(Math.random() * activePool.length)];
          }
        }

        render();
        await new Promise(r => setTimeout(r, 250));

        matches = checkMatches();
      }

      multiplier = 1;
      updateMultiplierUI(1);
    }

    function restartGame() {
      currentLevel = 0;
      initLevel();
    }

    initLevel();
  </script>
</body>
</html>
