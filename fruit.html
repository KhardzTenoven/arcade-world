<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍓 Fruit Match — Bright Arcade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: 
        radial-gradient(circle at 15% 10%, #5434b9 0, transparent 30%),
        radial-gradient(circle at 85% 15%, #008eb4 0, transparent 28%),
        linear-gradient(135deg, #090d24, #11183a 60%, #080b20);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .gamepage {
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gamebar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(18px, 4vw);
      border-bottom: 1px solid #ffffff14;
      background: #080c20dd;
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .gamebar h1 {
      font-size: 22px;
      margin: 0;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      background: #ffffff0d;
      padding: 11px 16px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff18;
    }

    .gamearea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .gamebox {
      width: min(900px, 100%);
      height: min(100%, 820px);
      min-height: 0;
      border: 1px solid #ffffff18;
      border-radius: 26px;
      background: #ffffff09;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px #0005;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .gamebox h2 {
      text-align: center;
      margin: 2px 0 10px;
    }

    .stats {
      text-align: center;
      color: #bfc9e7;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .multiplier-badge {
      color: #ffea00;
      font-weight: 900;
      transition: transform 0.2s;
      display: inline-block;
    }

    .multiplier-active {
      transform: scale(1.3);
      color: #ff4fa3;
    }

    .board {
      margin: auto;
      max-width: 100%;
      max-height: calc(100% - 110px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fruitgrid {
      display: grid;
      gap: 6px;
      width: min(520px, 100%);
      margin: auto;
    }

    .fruitgrid button {
      aspect-ratio: 1;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      font-size: clamp(20px, 4.5vw, 32px);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .fruitgrid button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .fruitgrid button.selected {
      outline: 3px solid #67e8ff;
      background: rgba(103, 232, 255, 0.25);
      transform: scale(1.05);
    }

    .touch {
      color: #8f9bc0;
      text-align: center;
      font-size: 13px;
      margin: 12px 0 0;
    }

    .center {
      text-align: center;
    }

    .restart {
      margin-top: 12px;
    }

    @media (max-width: 760px) {
      .gamebox {
        padding: 12px;
        border-radius: 20px;
      }
      .gamebar {
        height: 62px;
        flex-basis: 62px;
      }
      .gamebar h1 {
        font-size: 18px;
      }
      .gamearea {
        padding: 8px;
      }
      .fruitgrid {
        gap: 4px;
      }
      .fruitgrid button {
        border-radius: 8px;
      }
    }

    @media (max-width: 480px) {
      .gamebox h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="gamepage">

  <header class="gamebar">
    <a class="btn" href="index.html">← Home</a>
    <h1>🍓 Fruit Match</h1>
    <span style="color: #91a0c8; font-size: 12px;">Bright Arcade</span>
  </header>

  <main class="gamearea">
    <section class="gamebox">
      <h2>🍓 Fruit Match</h2>
      <div class="stats">
        Level <b id="lvl">1</b> • Score: <b id="score">0</b>/<span id="target">200</span> • Moves: <b id="moves">15</b> • Multiplier: <span id="mult" class="multiplier-badge">1x</span>
      </div>
      <div class="board">
        <div id="grid" class="fruitgrid"></div>
        <div class="touch">Match 4+ fruits or trigger cascades to build your score multiplier!</div>
      </div>
      <div class="center">
        <button class="btn restart" onclick="restartGame()">↻ Reset Game</button>
      </div>
    </section>
  </main>

  <script>
    const allFruits = ['🍓', '🍋', '🍇', '🍉', '🍊', '🍏', '🍍', '🍒', '🍌', '🫐', '🥝', '🍑', '🥑', '🍐', '🥭'];
    
    const levelConfigs = [
      { size: 6, fruitTypes: 5, target: 200, moves: 15 },  // Level 1
      { size: 6, fruitTypes: 6, target: 350, moves: 15 },  // Level 2
      { size: 7, fruitTypes: 8, target: 500, moves: 18 },  // Level 3
      { size: 7, fruitTypes: 10, target: 750, moves: 20 }, // Level 4
      { size: 8, fruitTypes: 12, target: 1000, moves: 22 },// Level 5
      { size: 8, fruitTypes: 15, target: 1500, moves: 25 } // Level 6
    ];

    let currentLevel = 0;
    let grid = [];
    let selectedIndex = null;
    let score = 0;
    let moves = 0;
    let targetScore = 0;
    let multiplier = 1;
    let isProcessing = false;

    function initLevel() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      score = 0;
      moves = config.moves;
      targetScore = config.target;
      multiplier = 1;
      selectedIndex = null;
      isProcessing = false;

      document.getElementById('lvl').textContent = currentLevel + 1;
      document.getElementById('score').textContent = score;
      document.getElementById('target').textContent = targetScore;
      document.getElementById('moves').textContent = moves;
      updateMultiplierUI(1);

      const activePool = allFruits.slice(0, config.fruitTypes);

      // Populate board without starting matches
      do {
        grid = [];
        for (let i = 0; i < config.size * config.size; i++) {
          grid.push(activePool[Math.floor(Math.random() * activePool.length)]);
        }
      } while (checkMatches().length > 0);

      render();
    }

    function updateMultiplierUI(mult) {
      const multElem = document.getElementById('mult');
      multElem.textContent = `${mult}x`;
      if (mult > 1) {
        multElem.classList.add('multiplier-active');
      } else {
        multElem.classList.remove('multiplier-active');
      }
    }

    function render() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const gridElement = document.getElementById('grid');
      
      gridElement.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
      gridElement.innerHTML = '';

      grid.forEach((fruit, index) => {
        const button = document.createElement('button');
        button.textContent = fruit;
        
        if (selectedIndex === index) {
          button.classList.add('selected');
        }

        button.onclick = () => handleClick(index);
        gridElement.appendChild(button);
      });
    }

    function handleClick(index) {
      if (isProcessing || moves <= 0) return;

      if (selectedIndex === null) {
        selectedIndex = index;
        render();
      } else if (selectedIndex === index) {
        selectedIndex = null;
        render();
      } else {
        if (isAdjacent(selectedIndex, index)) {
          swapAndProcess(selectedIndex, index);
        } else {
          selectedIndex = index;
          render();
        }
      }
    }

    function isAdjacent(idx1, idx2) {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const r1 = Math.floor(idx1 / config.size), c1 = idx1 % config.size;
      const r2 = Math.floor(idx2 / config.size), c2 = idx2 % config.size;
      return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
    }

    async function swapAndProcess(idx1, idx2) {
      isProcessing = true;
      
      // Swap elements
      [grid[idx1], grid[idx2]] = [grid[idx2], grid[idx1]];
      selectedIndex = null;
      render();

      const matches = checkMatches();

      if (matches.length > 0) {
        moves--;
        document.getElementById('moves').textContent = moves;
        await resolveMatches();

        // Check Victory / Defeat Conditions
        if (score >= targetScore) {
          setTimeout(() => {
            if (currentLevel < levelConfigs.length - 1) {
              alert(`🎉 Level ${currentLevel + 1} Cleared! Moving to Level ${currentLevel + 2}!`);
              currentLevel++;
              initLevel();
            } else {
              alert('🏆 CONGRATULATIONS! You completed all Fruit Match levels!');
              restartGame();
            }
          }, 250);
        } else if (moves <= 0) {
          setTimeout(() => {
            alert(`🎮 Out of moves! Target score not met. Try Level ${currentLevel + 1} again!`);
            initLevel();
          }, 250);
        }
      } else {
        // Revert swap if no match was made
        await new Promise(r => setTimeout(r, 250));
        [grid[idx1], grid[idx2]] = [grid[idx2], grid[idx1]];
        render();
      }

      isProcessing = false;
    }

    function checkMatches() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const SIZE = config.size;
      const matchedIndices = new Set();

      // Check Horizontal Matches
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE - 2; c++) {
          const idx = r * SIZE + c;
          const val = grid[idx];
          if (val && val === grid[idx + 1] && val === grid[idx + 2]) {
            matchedIndices.add(idx);
            matchedIndices.add(idx + 1);
            matchedIndices.add(idx + 2);
          }
        }
      }

      // Check Vertical Matches
      for (let r = 0; r < SIZE - 2; r++) {
        for (let c = 0; c < SIZE; c++) {
          const idx = r * SIZE + c;
          const val = grid[idx];
          if (val && val === grid[(r + 1) * SIZE + c] && val === grid[(r + 2) * SIZE + c]) {
            matchedIndices.add(idx);
            matchedIndices.add((r + 1) * SIZE + c);
            matchedIndices.add((r + 2) * SIZE + c);
          }
        }
      }

      return Array.from(matchedIndices);
    }

    async function resolveMatches() {
      const config = levelConfigs[currentLevel] || levelConfigs[levelConfigs.length - 1];
      const SIZE = config.size;
      const activePool = allFruits.slice(0, config.fruitTypes);
      
      let matches = checkMatches();
      let cascadeLevel = 0;

      while (matches.length > 0) {
        cascadeLevel++;
        
        // Base multiplier starts from match size (4+ items) or cascading chain loops
        if (matches.length >= 4) {
          multiplier = Math.max(multiplier, matches.length - 2); 
        }
        if (cascadeLevel > 1) {
          multiplier += 1; // Extra boost for cascading combo reactions
        }

        updateMultiplierUI(multiplier);

        // Add calculated multiplier score
        score += matches.length * 10 * multiplier;
        document.getElementById('score').textContent = score;

        // Clear matched fruits
        matches.forEach(i => grid[i] = null);
        render();
        await new Promise(r => setTimeout(r, 200));

        // Drop existing fruits down
        for (let c = 0; c < SIZE; c++) {
          for (let r = SIZE - 1; r >= 0; r--) {
            const idx = r * SIZE + c;
            if (grid[idx] === null) {
              for (let lookup = r - 1; lookup >= 0; lookup--) {
                const lookupIdx = lookup * SIZE + c;
                if (grid[lookupIdx] !== null) {
                  grid[idx] = grid[lookupIdx];
                  grid[lookupIdx] = null;
                  break;
                }
              }
            }
          }
        }

        // Refill top empty spots with new random fruits
        for (let i = 0; i < SIZE * SIZE; i++) {
          if (grid[i] === null) {
            grid[i] = activePool[Math.floor(Math.random() * activePool.length)];
          }
        }

        render();
        await new Promise(r => setTimeout(r, 250));

        // Re-check for cascading match chain
        matches = checkMatches();
      }

      // Reset multiplier back to 1x after turn sequence finishes
      multiplier = 1;
      updateMultiplierUI(1);
    }

    function restartGame() {
      currentLevel = 0;
      initLevel();
    }

    // Initialize game on script load
    initLevel();
  </script>
</body>
</html>
