<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🏎️ Neon Turbo — Bright Arcade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: radial-gradient(circle at 15% 10%, #5434b9 0, transparent 30%),
        radial-gradient(circle at 85% 15%, #008eb4 0, transparent 28%),
        linear-gradient(135deg, #090d24, #11183a 60%, #080b20);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .gamepage {
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gamebar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(18px, 4vw);
      border-bottom: 1px solid #ffffff14;
      background: #080c20dd;
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .gamebar h1 {
      font-size: 22px;
      margin: 0;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      background: #ffffff0d;
      padding: 9px 14px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff18;
    }

    .gamearea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .gamebox {
      width: min(900px, 100%);
      height: min(100%, 860px);
      min-height: 0;
      border: 1px solid #ffffff18;
      border-radius: 26px;
      background: #ffffff09;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px #0005;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .gamebox h2 {
      text-align: center;
      margin: 0 0 8px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      color: #bfc9e7;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .board {
      margin: auto;
      max-width: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: min(65vh, 75vw, 420px);
      height: min(65vh, 75vw, 520px);
      max-width: 100%;
      border-radius: 20px;
      background: #080d1a;
      border: 1px solid #ffffff18;
      touch-action: none;
    }

    .touch {
      color: #8f9bc0;
      text-align: center;
      font-size: 12px;
      margin: 6px 0 0;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body class="gamepage">

  <header class="gamebar">
    <a class="btn" href="index.html">← Home</a>
    <h1>🏎️ Neon Turbo</h1>
    <span style="color:#91a0c8;font-size:12px">Bright Arcade</span>
  </header>

  <main class="gamearea">
    <section class="gamebox">
      <h2>🏎️ Neon Turbo</h2>
      <div class="stats">
        <span>Score: <b id="score">0</b></span> |
        <span>🪙 Coins: <b id="coins">0</b></span>
      </div>

      <div class="board">
        <canvas id="board" width="420" height="520"></canvas>
        <div class="touch">Tap Left/Right side of screen or use Arrow keys/A-D</div>
      </div>

      <div class="controls-row">
        <button class="btn" id="audioToggle" onclick="toggleAudio()">🔊 Audio: OFF</button>
        <button class="btn" onclick="start()">↻ Restart</button>
      </div>
    </section>
  </main>

  <script>
    const C = document.getElementById('board'),
  x = C.getContext('2d');

let player, obstacles, coins, score, coinCount, gameSpeed, animId, gameOver = false;
let audioCtx = null, audioEnabled = false;

const LANES = [105, 210, 315];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleAudio() {
  initAudio();
  audioEnabled = !audioEnabled;
  document.getElementById('audioToggle').textContent = audioEnabled ? '🔊 Audio: ON' : '🔈 Audio: OFF';
}

function playBeep(freq, duration) {
  if (!audioEnabled || !audioCtx) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function start() {
  cancelAnimationFrame(animId);
  gameOver = false;
  score = 0;
  coinCount = 0;
  gameSpeed = 4;
  document.getElementById('score').textContent = score;
  document.getElementById('coins').textContent = coinCount;

  player = { lane: 1, y: 430, w: 38, h: 65 };
  obstacles = [];
  coins = [];

  loop();
}

function move(dir) {
  if (gameOver) return;
  initAudio();
  if (dir === 'left' && player.lane > 0) player.lane--;
  if (dir === 'right' && player.lane < 2) player.lane++;
  playBeep(300, 0.05);
}

let roadOffset = 0;

function loop() {
  if (gameOver) return;

  // Update
  score++;
  if (score % 250 === 0) gameSpeed += 0.8;
  document.getElementById('score').textContent = score;

  roadOffset = (roadOffset + gameSpeed) % 40;

  // Spawn Obstacles & Coins
  if (Math.random() < 0.025) {
    let lane = Math.floor(Math.random() * 3);
    obstacles.push({ lane, y: -70, w: 38, h: 65, color: Math.random() < 0.5 ? '#ff4f70' : '#ff9d45' });
  }

  if (Math.random() < 0.02) {
    let lane = Math.floor(Math.random() * 3);
    coins.push({ lane, y: -30, r: 12 });
  }

  // Move Obstacles & Coins
  obstacles.forEach(o => o.y += gameSpeed);
  coins.forEach(c => c.y += gameSpeed);

  // Check Collisions
  let px = LANES[player.lane];
  for (let o of obstacles) {
    let ox = LANES[o.lane];
    if (Math.abs(px - ox) < 30 && Math.abs(player.y - o.y) < 55) {
      gameOver = true;
      playBeep(120, 0.4);
      drawGameOver();
      return;
    }
  }

  // Collect Coins
  coins = coins.filter(c => {
    let cx = LANES[c.lane];
    if (Math.abs(px - cx) < 25 && Math.abs(player.y - c.y) < 35) {
      coinCount++;
      document.getElementById('coins').textContent = coinCount;
      playBeep(800, 0.1);
      return false;
    }
    return c.y < 550;
  });

  obstacles = obstacles.filter(o => o.y < 550);

  // Draw
  draw();

  animId = requestAnimationFrame(loop);
}

function draw() {
  // Road
  x.fillStyle = '#080d1a';
  x.fillRect(0, 0, 420, 520);

  // Lane Markers
  x.strokeStyle = '#ffffff20';
  x.setLineDash([20, 20]);
  x.lineDashOffset = -roadOffset;
  x.lineWidth = 3;

  x.beginPath();
  x.moveTo(140, 0); x.lineTo(140, 520);
  x.moveTo(280, 0); x.lineTo(280, 520);
  x.stroke();
  x.setLineDash([]);

  // Coins
  coins.forEach(c => {
    let cx = LANES[c.lane];
    x.fillStyle = '#ffd34d';
    x.beginPath();
    x.arc(cx, c.y, c.r, 0, Math.PI * 2);
    x.fill();
  });

  // Obstacles
  obstacles.forEach(o => {
    let ox = LANES[o.lane] - o.w / 2;
    x.fillStyle = o.color;
    x.beginPath();
    x.roundRect(ox, o.y, o.w, o.h, 8);
    x.fill();
  });

  // Player Car
  let px = LANES[player.lane] - player.w / 2;
  x.fillStyle = '#67e8ff';
  x.beginPath();
  x.roundRect(px, player.y, player.w, player.h, 8);
  x.fill();

  // Car Windshield
  x.fillStyle = '#080d1a';
  x.fillRect(px + 6, player.y + 12, player.w - 12, 14);
}

function drawGameOver() {
  x.fillStyle = '#000000aa';
  x.fillRect(0, 0, 420, 520);
  x.fillStyle = '#fff';
  x.font = 'bold 30px Inter';
  x.textAlign = 'center';
  x.fillText('CRASHED!', 210, 240);
  x.font = '16px Inter';
  x.fillText('Tap Restart to play again', 210, 280);
}

// Keyboard controls
document.addEventListener('keydown', e => {
  let k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') move('left');
  if (k === 'arrowright' || k === 'd') move('right');
});

// Swipe controls implementation
let touchStartX = 0;
let touchStartY = 0;

C.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: true });

C.addEventListener('touchend', e => {
  let touchEndX = e.changedTouches[0].clientX;
  let touchEndY = e.changedTouches[0].clientY;

  let dx = touchEndX - touchStartX;
  let dy = touchEndY - touchStartY;

  // Minimum threshold to prevent accidental taps from registering as swipes
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
    if (dx > 0) {
      move('right');
    } else {
      move('left');
    }
  }
}, { passive: true });

start();
  </script>
</body>
</html>
