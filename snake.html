<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🐍 Neon Snake — Bright Arcade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: 
        radial-gradient(circle at 15% 10%, #5434b9 0, transparent 30%),
        radial-gradient(circle at 85% 15%, #008eb4 0, transparent 28%),
        linear-gradient(135deg, #090d24, #11183a 60%, #080b20);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .gamepage {
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gamebar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(18px, 4vw);
      border-bottom: 1px solid #ffffff14;
      background: #080c20dd;
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .gamebar h1 {
      font-size: 22px;
      margin: 0;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      background: #ffffff0d;
      padding: 11px 16px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff18;
    }

    .gamearea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .gamebox {
      width: min(900px, 100%);
      height: min(100%, 820px);
      min-height: 0;
      border: 1px solid #ffffff18;
      border-radius: 26px;
      background: #ffffff09;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px #0005;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .gamebox h2 {
      text-align: center;
      margin: 2px 0 10px;
    }

    .stats {
      text-align: center;
      color: #bfc9e7;
      margin-bottom: 10px;
    }

    .board {
      margin: auto;
      max-width: 100%;
      max-height: calc(100% - 110px);
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
    }

    canvas {
      display: block;
      width: min(72vh, 78vw, 560px);
      height: min(72vh, 78vw, 560px);
      max-width: 100%;
      max-height: calc(100dvh - 210px);
      border-radius: 20px;
      background: #06101b;
      border: 1px solid #ffffff18;
      touch-action: none;
    }

    .touch {
      color: #8f9bc0;
      text-align: center;
      font-size: 13px;
      margin: 12px 0 0;
    }

    .center {
      text-align: center;
    }

    .restart {
      margin-top: 12px;
    }

    @media (max-width: 760px) {
      .gamebox {
        padding: 12px;
        border-radius: 20px;
      }
      .gamebar {
        height: 62px;
        flex-basis: 62px;
      }
      .gamebar h1 {
        font-size: 18px;
      }
      .gamearea {
        padding: 8px;
      }
    }

    @media (max-width: 480px) {
      .gamebox h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="gamepage">

  <header class="gamebar">
    <a class="btn" href="index.html">← Home</a>
    <h1>🐍 Neon Snake</h1>
    <span style="color: #91a0c8; font-size: 12px;">Bright Arcade</span>
  </header>

  <main class="gamearea">
    <section class="gamebox">
      <h2>🐍 Neon Snake</h2>
      <div class="stats">
        Score: <b id="score">0</b>
      </div>
      <div class="board">
        <canvas id="board" width="520" height="520"></canvas>
        <div class="touch">Swipe screen to control snake • Keyboard arrows/WASD supported</div>
      </div>
      <div class="center">
        <button class="btn restart" onclick="start()">↻ Restart</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const N = 20;

    let snake = [];
    let food = {};
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let score = 0;
    let timer = null;

    function start() {
      if (timer) clearInterval(timer);
      
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      
      document.getElementById('score').textContent = score;
      
      placeFood();
      draw();
      timer = setInterval(tick, 105);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * N),
          y: Math.floor(Math.random() * N)
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function go(k) {
      const moves = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      
      const newMove = moves[k];
      
      // Prevent 180-degree immediate turns
      if (newMove && !(newMove.x === -dir.x && newMove.y === -dir.y)) {
        nextDir = newMove;
      }
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision or self collision check
      if (
        head.x < 0 || head.y < 0 || 
        head.x >= N || head.y >= N || 
        snake.some(segment => segment.x === head.x && segment.y === head.y)
      ) {
        clearInterval(timer);
        alert(`💥 Game Over! Final Score: ${score}`);
        return;
      }

      snake.unshift(head);

      // Food collision check
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background Grid
      ctx.fillStyle = '#06101b';
      ctx.fillRect(0, 0, 520, 520);

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          ctx.fillStyle = (i + j) % 2 ? '#0a1622' : '#09131f';
          ctx.fillRect(i * 26, j * 26, 26, 26);
        }
      }

      // Draw Food
      if (food) {
        ctx.fillStyle = '#ff4fa3';
        ctx.beginPath();
        ctx.arc(food.x * 26 + 13, food.y * 26 + 13, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#9affdc' : '#42e6a4';
        ctx.beginPath();
        ctx.roundRect(segment.x * 26 + 2, segment.y * 26 + 2, 22, 22, 7);
        ctx.fill();
      });
    }

    // Keyboard Listeners
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') go('up');
      if (key === 'arrowdown' || key === 's') go('down');
      if (key === 'arrowleft' || key === 'a') go('left');
      if (key === 'arrowright' || key === 'd') go('right');
    });

    // Touch Swipe Event Listeners
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (!e.changedTouches.length) return;
      
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      
      const minSwipeDistance = 15;

      if (Math.max(Math.abs(diffX), Math.abs(diffY)) < minSwipeDistance) return;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        go(diffX > 0 ? 'right' : 'left');
      } else {
        go(diffY > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    // Initial Start
    start();
  </script>
</body>
</html>
