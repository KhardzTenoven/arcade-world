<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🐉 Neon Dragon — Bright Arcade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: radial-gradient(circle at 15% 10%, #5434b9 0, transparent 30%),
        radial-gradient(circle at 85% 15%, #008eb4 0, transparent 28%),
        linear-gradient(135deg, #090d24, #11183a 60%, #080b20);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .1;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .gamepage {
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .gamebar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(18px, 4vw);
      border-bottom: 1px solid #ffffff14;
      background: #080c20dd;
      backdrop-filter: blur(18px);
      z-index: 5;
    }

    .gamebar h1 {
      font-size: 22px;
      margin: 0;
    }

    .btn {
      color: #fff;
      text-decoration: none;
      border: 1px solid #ffffff20;
      background: #ffffff0d;
      padding: 9px 14px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff18;
    }

    .gamearea {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .gamebox {
      width: min(900px, 100%);
      height: min(100%, 860px);
      min-height: 0;
      border: 1px solid #ffffff18;
      border-radius: 26px;
      background: #ffffff09;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px #0005;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .gamebox h2 {
      text-align: center;
      margin: 0 0 8px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      color: #bfc9e7;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .board {
      margin: auto;
      max-width: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: min(65vh, 75vw, 500px);
      height: min(65vh, 75vw, 500px);
      max-width: 100%;
      border-radius: 20px;
      background: #06101b;
      border: 1px solid #ffffff18;
      touch-action: none;
    }

    .touch {
      color: #8f9bc0;
      text-align: center;
      font-size: 12px;
      margin: 6px 0 0;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    select {
      background: #ffffff12;
      color: #fff;
      border: 1px solid #ffffff20;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    select option {
      background: #11183a;
      color: #fff;
    }
  </style>
</head>
<body class="gamepage">

  <header class="gamebar">
    <a class="btn" href="index.html">← Home</a>
    <h1>🐉 Neon Dragon</h1>
    <span style="color:#91a0c8;font-size:12px">Bright Arcade</span>
  </header>

  <main class="gamearea">
    <section class="gamebox">
      <h2>🐉 Neon Dragon</h2>
      <div class="stats">
        <span>Score: <b id="score">0</b></span> |
        <span>💎 Gems: <b id="gems">0</b></span> |
        <span>Level: <b id="skinLevel">1</b> (Cost: <span id="upgradeCost">10</span>💎)</span>
      </div>
      
      <div class="board">
        <canvas id="board" width="520" height="520"></canvas>
        <div class="touch">Swipe screen or tap grid directions to steer dragon</div>
      </div>

      <div class="controls-row">
        <label for="difficulty">Mode: </label>
        <select id="difficulty" onchange="changeDifficulty(this.value)">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="legendary">Legendary</option>
        </select>
        <button class="btn" onclick="upgradeSkin()">⚡ Upgrade Dragon Skin</button>
        <button class="btn" id="reviveBtn" onclick="revive()" style="display:none; background:#ff4f70;">❤️ Revive (5💎)</button>
        <button class="btn" onclick="start()">↻ Restart</button>
      </div>
    </section>
  </main>

  <script>
    const C = document.getElementById('board'),
      x = C.getContext('2d'),
      N = 20;

    let s, f, gemsList = [], d, nd, score = 0, gems = 0, skinLevel = 1, timer;
    let isDead = false;
    let speed = 105;

    const speeds = {
      easy: 150,
      medium: 105,
      hard: 75,
      legendary: 45
    };

    const dragonSkins = [
      { head: '#9affdc', body: '#42e6a4', wing: '#ff82c8' },
      { head: '#75eaff', body: '#008eb4', wing: '#ffd34d' },
      { head: '#ffd34d', body: '#ff9d45', wing: '#ff537d' },
      { head: '#a778ff', body: '#5434b9', wing: '#65dc7c' }
    ];

    function changeDifficulty(val) {
      speed = speeds[val] || 105;
      if (!isDead) start();
    }

    function start() {
      clearInterval(timer);
      isDead = false;
      document.getElementById('reviveBtn').style.display = 'none';
      s = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      d = { x: 1, y: 0 };
      nd = d;
      score = 0;
      document.getElementById('score').textContent = score;
      placeFood();
      gemsList = [];
      draw();
      timer = setInterval(tick, speed);
    }

    function placeFood() {
      do {
        f = {
          x: Math.floor(Math.random() * N),
          y: Math.floor(Math.random() * N)
        };
      } while (s.some(a => a.x === f.x && a.y === f.y));

      // Randomly spawn a gem
      if (Math.random() < 0.35 && gemsList.length < 2) {
        let g;
        do {
          g = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
        } while (s.some(a => a.x === g.x && a.y === g.y) || (f.x === g.x && f.y === g.y));
        gemsList.push(g);
      }
    }

    function go(k) {
      let m = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      }[k];
      if (m && !(m.x === -d.x && m.y === -d.y)) nd = m;
    }

    function tick() {
      d = nd;
      let h = { x: s[0].x + d.x, y: s[0].y + d.y };

      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || s.some(a => a.x === h.x && a.y === h.y)) {
        clearInterval(timer);
        isDead = true;
        document.getElementById('reviveBtn').style.display = 'inline-block';
        return;
      }

      s.unshift(h);

      // Eat Food
      if (h.x === f.x && h.y === f.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        placeFood();
      } else {
        s.pop();
      }

      // Collect Gems
      gemsList = gemsList.filter(g => {
        if (h.x === g.x && h.y === g.y) {
          gems += 1;
          document.getElementById('gems').textContent = gems;
          return false;
        }
        return true;
      });

      draw();
    }

    function revive() {
      if (gems >= 5 && isDead) {
        gems -= 5;
        document.getElementById('gems').textContent = gems;
        isDead = false;
        document.getElementById('reviveBtn').style.display = 'none';
        
        // Push head to a valid direction
        let head = s[0];
        if (head.x < 0) head.x = 0;
        if (head.x >= N) head.x = N - 1;
        if (head.y < 0) head.y = 0;
        if (head.y >= N) head.y = N - 1;

        timer = setInterval(tick, speed);
      } else if (gems < 5) {
        alert("You need at least 5 Gems to Revive!");
      }
    }

    function upgradeSkin() {
      let cost = skinLevel * 10;
      if (gems >= cost && skinLevel < dragonSkins.length) {
        gems -= cost;
        skinLevel++;
        document.getElementById('gems').textContent = gems;
        document.getElementById('skinLevel').textContent = skinLevel;
        document.getElementById('upgradeCost').textContent = skinLevel * 10;
        draw();
      } else if (skinLevel >= dragonSkins.length) {
        alert("Max Dragon Level Reached!");
      } else {
        alert(`Need ${cost} Gems to level up dragon skin!`);
      }
    }

    function draw() {
      x.fillStyle = '#06101b';
      x.fillRect(0, 0, 520, 520);

      // Grid
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          x.fillStyle = (i + j) % 2 ? '#0a1622' : '#09131f';
          x.fillRect(i * 26, j * 26, 26, 26);
        }
      }

      // Food
      if (f) {
        x.fillStyle = '#ff4fa3';
        x.beginPath();
        x.arc(f.x * 26 + 13, f.y * 26 + 13, 9, 0, 7);
        x.fill();
      }

      // Gems
      gemsList.forEach(g => {
        x.fillStyle = '#63cfff';
        x.beginPath();
        x.moveTo(g.x * 26 + 13, g.y * 26 + 3);
        x.lineTo(g.x * 26 + 23, g.y * 26 + 13);
        x.lineTo(g.x * 26 + 13, g.y * 26 + 23);
        x.lineTo(g.x * 26 + 3, g.y * 26 + 13);
        x.closePath();
        x.fill();
      });

      // Dragon
      let skin = dragonSkins[skinLevel - 1];
      s?.forEach((a, i) => {
        if (i === 0) {
          // Dragon Head
          x.fillStyle = skin.head;
          x.beginPath();
          x.arc(a.x * 26 + 13, a.y * 26 + 13, 12, 0, Math.PI * 2);
          x.fill();

          // Dragon Horns
          x.fillStyle = skin.wing;
          x.fillRect(a.x * 26 + 4, a.y * 26 + 2, 5, 5);
          x.fillRect(a.x * 26 + 17, a.y * 26 + 2, 5, 5);
        } else {
          // Dragon Body & Wings
          x.fillStyle = skin.body;
          x.beginPath();
          x.roundRect(a.x * 26 + 3, a.y * 26 + 3, 20, 20, 6);
          x.fill();

          if (i % 2 === 1) {
            x.fillStyle = skin.wing;
            x.fillRect(a.x * 26 - 2, a.y * 26 + 8, 4, 10);
            x.fillRect(a.x * 26 + 24, a.y * 26 + 8, 4, 10);
          }
        }
      });
    }

    document.addEventListener('keydown', e => {
      let k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') go('up');
      if (k === 'arrowdown' || k === 's') go('down');
      if (k === 'arrowleft' || k === 'a') go('left');
      if (k === 'arrowright' || k === 'd') go('right');
    });

    // Touch Swipe Control
    let tx, ty;
    C.addEventListener('touchstart', e => {
      tx = e.changedTouches[0].clientX;
      ty = e.changedTouches[0].clientY;
    }, { passive: true });

    C.addEventListener('touchend', e => {
      let a = e.changedTouches[0],
        dx = a.clientX - tx,
        dy = a.clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) {
        // Direct tap relative direction on canvas
        let rect = C.getBoundingClientRect();
        let tapX = a.clientX - rect.left - (rect.width / 2);
        let tapY = a.clientY - rect.top - (rect.height / 2);
        if (Math.abs(tapX) > Math.abs(tapY)) {
          go(tapX > 0 ? 'right' : 'left');
        } else {
          go(tapY > 0 ? 'down' : 'up');
        }
        return;
      }
      go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }, { passive: true });

    start();
  </script>
</body>
</html>
